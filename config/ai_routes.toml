[providers.deepseek]
credential_host = "api.deepseek.com"
api_prefix = ""
api_mode = "chat_completions"
thinking_enabled = false
models = [
    "deepseek-v4-flash",
    "deepseek-v4-pro",
    "deepseek-v4-flash-vision-exp",
]

[providers.gemini]
credential_host = "36.139.40.114"
api_prefix = "v1beta"
api_mode = "gemini"
thinking_level = "high"
models = ["gemini-3.8-flash-high"]

[providers.gpt]
credential_host = "api.huanyan.ltd"
api_prefix = "v1"
api_mode = "responses"
responses_stream = true
models = [
    "gpt-5.6-sol",
    "gpt-6-astra",
    "gpt-6-sol",
    "gpt-6.1-sol",
    "gpt-6.2-astra",
    "gpt-6.2-sol",
]

[runtime]
default_model = "gemini/gemini-3.8-flash-high"

[tasks.chat]
primary = "gemini/gemini-3.8-flash-high"
fallbacks = ["deepseek/deepseek-v4-flash", "deepseek/deepseek-v4-pro", "gpt/gpt-5.6-sol"]
temperature = 0.75
max_tokens = 8192

[tasks.tool_planner]
primary = "deepseek/deepseek-v4-flash"
fallbacks = ["deepseek/deepseek-v4-pro"]
temperature = 0.2
max_tokens = 1000

[tasks.proactive_gate]
primary = "deepseek/deepseek-v4-flash"
fallbacks = ["deepseek/deepseek-v4-pro"]
temperature = 0.0
max_tokens = 8192

[tasks.summary]
primary = "deepseek/deepseek-v4-flash"
fallbacks = ["deepseek/deepseek-v4-pro"]
temperature = 0.2
max_tokens = 16384

[tasks.stats_analysis]
primary = "deepseek/deepseek-v4-flash"
fallbacks = ["deepseek/deepseek-v4-pro"]
temperature = 0.2
max_tokens = 16384

[tasks.memory_extraction]
primary = "deepseek/deepseek-v4-flash"
fallbacks = ["deepseek/deepseek-v4-pro"]
temperature = 0.0
max_tokens = 700

[tasks.vision]
primary = "gemini/gemini-3.8-flash-high"
fallbacks = ["deepseek/deepseek-v4-flash-vision-exp"]
temperature = 0.2
max_tokens = 1000

[tasks.complex_reasoning]
primary = "deepseek/deepseek-v4-pro"
fallbacks = ["deepseek/deepseek-v4-flash"]
temperature = 0.25
max_tokens = 2400
